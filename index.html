<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Presupuestos Digital Law Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}body{margin:0}
#login{position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:var(--bg);padding:16px}
#login form{width:min(380px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px;display:grid;gap:12px;box-shadow:0 8px 30px rgba(40,50,20,.10)}
#login img{width:150px;justify-self:center}
#login h2{margin:0;text-align:center;font-family:'Merriweather',serif;font-size:19px;color:var(--ink)}
#login label{display:grid;gap:4px;font-size:13px;color:var(--mute);font-weight:600}
#login input{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink)}
#login button{font:inherit;font-weight:700;padding:10px;border:0;border-radius:8px;background:var(--olive);color:#fff;cursor:pointer}
#login .err{color:#B3261E;font-size:13px;min-height:1em;text-align:center}
</style>
<style>
/* Layout: barra superior, lista de clientes a la izquierda, y a la derecha el presupuesto (editor + hoja A4 en vista previa).
   Colores: verde oliva = Law Office / juicios, celeste suave = escribanía. La hoja impresa siempre es papel blanco. */
:root{
  --bg:#F1F2EA; --panel:#FAFAF5; --field:#FFFFFF; --ink:#1F2318; --mute:#62684F; --line:#D9DCCB; --line2:#E7E9DC;
  --olive:#6B7A30; --olive-ink:#4C5822; --olive-tint:#E7EBD0;
  --cel:#5A9BC6; --cel-ink:#2B6B97; --cel-tint:#E1EEF7;
  --acc:var(--cel); --acc-ink:var(--cel-ink); --acc-tint:var(--cel-tint);
  --ok:#2F7A44; --ok-bg:#DDEFE1; --warn:#946712; --warn-bg:#F6EBCB; --bad:#A93E2C; --bad-bg:#F6DDD7;
  --shadow:0 1px 2px rgba(40,46,20,.08),0 6px 20px rgba(40,46,20,.07);
  --f-display:'Merriweather',Georgia,'Times New Roman',serif;
  --f-body:'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13160D; --panel:#1B1F13; --field:#14170E; --ink:#E8EBDA; --mute:#9CA38A; --line:#2E3422; --line2:#252A1B;
  --olive:#A3B65A; --olive-ink:#C0D27E; --olive-tint:#2B3317;
  --cel:#7DB6DC; --cel-ink:#A2CDEA; --cel-tint:#182A36;
  --ok:#7CCB92; --ok-bg:#1A3022; --warn:#E3B95A; --warn-bg:#3A2E10; --bad:#EE8F7E; --bad-bg:#3C1E19;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13160D; --panel:#1B1F13; --field:#14170E; --ink:#E8EBDA; --mute:#9CA38A; --line:#2E3422; --line2:#252A1B;
  --olive:#A3B65A; --olive-ink:#C0D27E; --olive-tint:#2B3317;
  --cel:#7DB6DC; --cel-ink:#A2CDEA; --cel-tint:#182A36;
  --ok:#7CCB92; --ok-bg:#1A3022; --warn:#E3B95A; --warn-bg:#3A2E10; --bad:#EE8F7E; --bad-bg:#3C1E19;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--f-body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px;max-width:1680px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}

/* barra superior */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:14px}
.top .brand{display:flex;align-items:center;gap:10px;min-width:0}
.top .brand img{height:34px;width:auto;display:block}
.top h1{font:900 17px/1.1 var(--f-display);margin:0;letter-spacing:.2px}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--mute);white-space:nowrap}
.pill.ok{color:var(--ok);background:var(--ok-bg);border-color:transparent}
.pill.warn{color:var(--warn);background:var(--warn-bg);border-color:transparent}
.pill.bad{color:var(--bad);background:var(--bad-bg);border-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 13px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:14px;line-height:1.2}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
:root:not([data-theme="light"]) .btn.pri{color:#10140A}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.danger.arm{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* estructura */
.shell.home{grid-template-columns:minmax(0,1fr)}.shell.home .side{display:none}
.home-h h2{font:900 26px/1.2 var(--f-display);margin:8px 0 6px}.home-h p{margin:0;color:var(--mute)}
.homegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px;margin-top:6px;max-width:1000px}
.area{display:flex;flex-direction:column;align-items:flex-start;gap:12px;text-align:left;padding:28px 28px 24px;border-radius:16px;border:1.5px solid var(--line);background:var(--panel);min-height:320px;transition:transform .15s,box-shadow .15s}
.area:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.area img{height:100px;width:auto;max-width:100%}.area .at{font:900 23px/1.2 var(--f-display)}.area .ad{color:var(--mute);max-width:44ch}.area .am{margin-top:auto;font-weight:700;font-size:14px}
.area.a-esc{border-color:var(--cel);background:linear-gradient(180deg,var(--cel-tint),var(--panel) 75%)}.area.a-esc .at{color:var(--cel-ink)}
.area.a-jud{border-color:var(--olive);background:linear-gradient(180deg,var(--olive-tint),var(--panel) 75%)}.area.a-jud .at{color:var(--olive-ink)}
.shell{display:grid;grid-template-columns:270px minmax(0,1fr);gap:18px;align-items:start}
.side{position:sticky;top:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 24px)}
.side h2,.sec-h{font:700 11.5px/1 var(--f-body);text-transform:uppercase;letter-spacing:.09em;color:var(--mute);margin:0}
.search{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--field)}
.clist{display:flex;flex-direction:column;gap:2px;overflow:auto;min-height:0}
.citem{display:grid;grid-template-columns:1fr auto;gap:2px 8px;text-align:left;padding:8px 10px;border-radius:8px;border:1px solid transparent;background:transparent;width:100%}
.citem:hover{background:var(--line2)}
.citem[aria-current="true"]{background:var(--olive-tint);border-color:var(--line)}
.citem .n{font-weight:600;overflow-wrap:anywhere}
.citem .s{font-size:12.5px;color:var(--mute)}
.citem .d{grid-row:1/3;grid-column:2;align-self:center;text-align:right;font-size:13px;font-weight:700;color:var(--bad)}
.citem .d.z{color:var(--ok)}
.main{min-width:0;display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card h3{font:700 15px/1.2 var(--f-display);margin:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.card-h .tot{font-weight:700}
.empty{padding:40px 20px;text-align:center;color:var(--mute)}
.empty b{display:block;font:700 17px var(--f-display);color:var(--ink);margin-bottom:6px}

/* cliente */
.chead{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:end}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.in{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--field);min-width:0}
.in:focus{border-color:var(--acc)}
.in.big{font:900 20px/1.2 var(--f-display);padding:6px 9px}
.in.r{text-align:right}
textarea.in{resize:vertical;min-height:58px}

/* presupuestos del cliente */
.bchips{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.bchip{display:flex;flex-direction:column;gap:3px;text-align:left;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);min-width:170px;max-width:260px}
.bchip[aria-current="true"]{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc);background:var(--acc-tint)}
.bchip .t{font-weight:700;font-size:14px;overflow-wrap:anywhere}
.bchip .m{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--mute)}
.tplgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:10px}
.tpl{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--field);text-align:left;display:flex;flex-direction:column;gap:2px}
.tpl:hover{border-color:var(--acc)}
.tpl b{font-size:14px}.tpl small{color:var(--mute);font-size:12.5px}
.tpl .k{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.tpl .k.e{color:var(--cel-ink)}.tpl .k.j{color:var(--olive-ink)}

/* resumen */
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(180px,1.3fr);gap:0;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.sum>div{padding:11px 16px;border-right:1px solid var(--line)}
.sum>div:last-child{border-right:0}
.sum small{display:block;font-size:11.5px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.sum b{font:900 21px/1.25 var(--f-display)}
.sum .saldo b{color:var(--bad)}.sum .saldo.z b{color:var(--ok)}
.bar{height:8px;border-radius:99px;background:var(--line2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .25s}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar .sp{flex:1}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13.5px}
.hint{font-size:12.5px;color:var(--mute)}
.seg{display:none;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden;align-self:flex-start}
.seg button{border:0;background:var(--panel);padding:7px 18px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--acc);color:#fff}
:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#10140A}

/* editor / documento */
.work{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.95fr);gap:16px;align-items:start}
.editor{display:flex;flex-direction:column;gap:12px;min-width:0}
.docpane{position:sticky;top:12px;min-width:0}
.docwrap{position:relative;overflow:hidden;border-radius:10px;background:var(--line2);padding:0}
.docinner{width:794px;transform-origin:0 0;display:flex;flex-direction:column;gap:20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.ln{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(104px,128px) minmax(104px,128px) 26px;grid-template-areas:"c l l l x" ". m v a .";gap:6px 8px;align-items:center;padding:7px 0;border-top:1px solid var(--line2)}
.ln>.on{grid-area:c}.ln>.lbl{grid-area:l}.ln>.x{grid-area:x}.ln>.mode{grid-area:m}.ln>.unit{grid-area:v}.ln>.amt{grid-area:a}
.ln:first-of-type{border-top:0}
.ln.off .lbl{color:var(--mute);text-decoration:line-through}
.ln .amt{text-align:right;font-weight:700}
.ln.off .amt{color:var(--mute);font-weight:400}
.ln .x{border:0;background:transparent;color:var(--mute);font-size:19px;line-height:1;padding:2px;border-radius:6px}
.ln .x:hover{color:var(--bad)}
.unit{position:relative}
.unit .in{padding-right:44px;text-align:right}
.unit em{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-style:normal;font-size:11.5px;color:var(--mute);pointer-events:none}
.csjnote{font-size:12px;color:var(--mute);grid-column:2/-1;margin-top:-4px}
.addrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.addrow select{max-width:100%;padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:var(--field)}
.disc{margin-top:8px;padding-top:8px;border-top:2px solid var(--line)}
.pago{display:grid;grid-template-columns:128px 1fr 118px 128px 26px;gap:6px 8px;align-items:center;padding:6px 0;border-top:1px solid var(--line2)}
.pago .nt{grid-column:1/-1}
.pagohead{font-size:11.5px}

/* ---------- hoja A4 (papel) ---------- */
.sheet{--paper:#FFFFFF;--tx:#1E2118;--tm:#5B6150;
  width:794px;min-height:1123px;background:var(--paper);color:var(--tx);padding:46px 54px 40px;position:relative;
  box-shadow:var(--shadow);font:13.5px/1.35 var(--f-body);display:flex;flex-direction:column}
.sheet.t-escribania{--sc:#5A9BC6;--sct:#2B6B97;--st:#EAF3FA;--sl:#BFD9EA}
.sheet.t-juicio{--sc:#6B7A30;--sct:#4C5822;--st:#EEF1DB;--sl:#CDD5A8}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding-bottom:14px;border-bottom:3px solid var(--sc)}
.sh-brand img{height:84px;width:auto;display:block}
.sh-brand.sh-seal{display:flex;align-items:center;gap:16px}.sh-brand.sh-seal img{height:96px;width:auto}
.sh-esc-n{font:900 21px/1.1 var(--f-display);color:var(--sct);text-transform:uppercase;letter-spacing:.07em}.sh-esc-d{margin-top:5px;font-size:12.5px;color:var(--tm)}
.sh-line{margin-top:6px;font:700 11px var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:var(--sct)}
.sh-meta{text-align:right;font-size:13px;color:var(--tm);display:flex;flex-direction:column;gap:2px}
.sh-title{font:900 25px/1.1 var(--f-display);color:var(--sct);letter-spacing:.5px;margin-bottom:6px}
.sh-info{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;margin:16px 0 12px;padding:10px 14px;background:var(--st);border-radius:6px}
.sh-info .w{grid-column:1/-1}
.sh-info label{display:block;font:700 10px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--sct)}
.sh-info div>span{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.sh-tbl{width:100%;border-collapse:collapse;margin-top:4px}
.sh-tbl th{font:700 10px/1.25 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--sct);text-align:right;padding:4px 6px;border-bottom:1px solid var(--sc)}
.sh-tbl th:first-child{text-align:left}
.sh-tbl td{padding:3px 6px;vertical-align:top}
.sh-tbl td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.sh-tbl tr.sec td{padding-top:11px;font:700 12px var(--f-body);letter-spacing:.08em;color:var(--sct);text-transform:uppercase;border-bottom:1px solid var(--sl)}
.sh-tbl tr.sub td{border-top:1px solid var(--sl);font-weight:700}
.sh-tbl td.ind{padding-left:20px}
.sh-tbl tr.neg td.n{color:#A33}
.sh-tbl .mu{color:var(--tm);font-size:12px}
.sh-tot{margin-top:12px;margin-left:auto;width:345px;display:flex;flex-direction:column;gap:3px}
.sh-tot div{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.sh-tot .iva{font-size:12.5px;color:var(--tm)}
.sh-tot .big{margin-top:5px;padding:9px 12px;background:var(--st);border:2px solid var(--sc);border-radius:6px;font:900 17px/1.2 var(--f-display);color:var(--sct)}
.sh-tot .pg{font-weight:700}
.sh-tot .ret{margin-top:6px;padding-top:6px;border-top:1px dashed var(--sl);color:var(--tm)}
.sh-tot .sd{font-weight:700;font-size:15px;border-top:1px solid var(--sl);padding-top:4px}
.sh-box{margin-top:14px}
.sh-box h4{margin:0 0 4px;font:700 11px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--sct)}
.sh-box p{margin:0;white-space:pre-wrap}
.sh-foot{margin-top:auto;padding-top:16px;border-top:1px solid var(--sl);font-size:11.5px;color:var(--tm);display:flex;justify-content:space-between;gap:16px}
.sh-esc td{padding:2px 6px}
.sh-esc tr.hit td{background:var(--st);font-weight:700;color:var(--sct)}
.sh-note{font-size:11.5px;color:var(--tm);margin-top:6px}
.sp1{flex:1;min-height:12px}

.cfg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.crow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1.5fr) 100px 90px 110px 70px 38px 28px;gap:6px;align-items:center;padding:5px 0;border-top:1px solid var(--line2)}
.crow.h{font-size:11px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;border-top:0}
.erow{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1.1fr) 92px 92px 112px minmax(0,.9fr) 38px;gap:6px;align-items:center;padding:5px 0;border-top:1px solid var(--line2)}
.erow.h{font-size:11px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;border-top:0}
.scroll{overflow-x:auto}
.offscreen{position:fixed;left:-12000px;top:0;width:794px;display:flex;flex-direction:column;gap:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;font-weight:600;z-index:50;max-width:calc(100vw - 32px);box-shadow:var(--shadow)}

@media (max-width:1180px){
  .work{grid-template-columns:minmax(0,1fr)}
  .seg{display:inline-flex}
  .work[data-tab="edit"] .docpane{display:none}
  .work[data-tab="doc"] .editor{display:none}
  .docpane{position:static}
}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:static;max-height:none}
  .clist{flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .citem{min-width:190px;width:auto;border-color:var(--line2)}
  .chead{grid-template-columns:1fr 1fr}
  .chead .fld:first-child{grid-column:1/-1}
  .sum{grid-template-columns:1fr 1fr}
  .sum>div{border-bottom:1px solid var(--line)}
}
@media (max-width:620px){
  .ln{grid-template-columns:22px minmax(0,1fr) minmax(0,1fr) 26px;grid-template-areas:"c l l x" ". m m m" ". v a a"}
  .csjnote{grid-column:2/-1}
  .pago{grid-template-columns:1fr 1fr}
  .pago .x{justify-self:end}
  .crow,.crow.h,.erow,.erow.h{grid-template-columns:1fr 1fr}
  .crow.h,.erow.h{display:none}
  .bchip{min-width:140px}
}
@media print{
  body{background:#fff}
  .noprint{display:none!important}
  .shell,.work,.docpane{display:block!important}
  .docwrap{height:auto!important;overflow:visible!important;background:none}
  .docinner{transform:none!important;gap:0}
  .sheet{box-shadow:none;break-after:page;min-height:auto}
  @page{size:A4;margin:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head><body>
<div id="login" hidden><form id="lform" autocomplete="on"><img id="llogo" alt="Digital Law Office"><h2>Presupuestos · uso interno</h2>
<label>Correo<input id="lmail" type="email" autocomplete="username" required></label>
<label>Contraseña<input id="lpass" type="password" autocomplete="current-password" required></label>

function cfgJornal(cfg){return cfg.jornalManual>0?Math.round(cfg.jornalManual):Math.round((cfg.salario||0)/26)}
function jornalOf(b,cfg){return (b&&b.jornal>0)?b.jornal:cfgJornal(cfg)}
function csjBase(it,j){if(it.fijo>0)return Math.round(it.fijo);let base=Math.round((it.f||0)*j);if(it.m&&it.m!==1)base=Math.round(base*it.m);return base}
function csjAmount(it,j){const base=csjBase(it,j);return it.iva?base+Math.round(base/10):base}
function descActive(b){const d=b.descuento||{};return b.descOn===undefined?(Number(d.val)>0):!!b.descOn}
function escJ(it,b){return b.dist==='mas'?it.j2:it.j1}
function escAmount(it,b,j){if(it.fijo>0)return Math.round(it.fijo);const base=Math.round(escJ(it,b)*j);return base+Math.round(base/10)}
function arancelTier(v,cfg){let t=null;for(const e of cfg.escala){if(v>e.desde)t=e}return t}
function arancel(v,cfg,j){if(!(v>0))return 0;if(v<=1000000)return 5*j;const t=arancelTier(v,cfg);return t?Math.round(v*t.pct/100):0}
function lineAmount(l,b,cfg){
  const v=valorGs(b),j=jornalOf(b,cfg),x=Number(l.val)||0;
  switch(l.mode){
    case'pct':return Math.round(v*x/100);
    case'jornales':return Math.round(x*j);
    case'arancel':return Math.round(arancel(v,cfg,j)*(l.val===undefined?100:x)/100);
    case'csj':{const it=cfg.csj.find(i=>i.id===l.csj);return it?csjAmount(it,j):Math.round(x)}
    case'esc':{const it=(cfg.esc||[]).find(i=>i.id===l.esc);return it?escAmount(it,b,j):Math.round(x)}
    default:return Math.round(x);
  }
}
function calc(b,cfg){
  const rows=g=>(b[g]||[]).filter(l=>l.on&&l.k!=='ret').map(l=>({l,amt:lineAmount(l,b,cfg)}));
  const sum=a=>a.reduce((s,r)=>s+r.amt,0);
  const reem=rows('reembolso'),gas=rows('gastos'),hon=rows('honorarios');
  const all=g=>(b[g]||[]).filter(l=>l.k!=='ret').map(l=>({l,on:!!l.on,amt:l.on?lineAmount(l,b,cfg):0}));
  const reemAll=all('reembolso'),gasAll=all('gastos');
  const tReem=sum(reem),tGas=sum(gas),tHon=sum(hon);
  const d=b.descuento||{mode:'monto',val:0};
  let desc=d.mode==='pct'?Math.round(tHon*(Number(d.val)||0)/100):Math.round(Number(d.val)||0);
  desc=descActive(b)?Math.max(0,Math.min(desc,tHon)):0;
  const tServ=tGas+tHon-desc,iva10=Math.round(tServ/11),total=tReem+tServ;
  const pagado=(b.pagos||[]).reduce((s,p)=>s+(Math.round(Number(p.monto))||0),0);
  const sn=b.sena||{mode:'pct',val:0};
  const senaAmt=sn.mode==='monto'?Math.round(Number(sn.val)||0):Math.round(total*(Number(sn.val)||0)/100);
  const saldo=total-pagado;
  const rt=b.ret&&b.ret.on?(b.ret.mode==='monto'?Math.round(Number(b.ret.val)||0):Math.round(valorGs(b)*(Number(b.ret.val)||0)/100)):0;
  const estado=total>0&&pagado>=total?'Pagado':pagado>0?'Parcial':'Pendiente';
  return {ret:rt,totalConRet:total+rt,reemAll,gasAll,reem,gas,hon,tReem,tGas,tHon,desc,tServ,iva10,total,pagado,saldo,senaAmt,estado,pct:total>0?Math.min(100,pagado/total*100):0};
}

}

let rafDoc=0;
function refreshNumbers(now){
  const b=curB();if(!b)return;

  document.querySelectorAll('[data-amt]').forEach(o=>{const [g,i]=o.dataset.amt.split(':');const l=b[g]&&b[g][+i];if(l)o.textContent=fmt(lineAmount(l,b,S.cfg))});

  const pt=$('#pg-tot');if(pt)pt.textContent='Pagado Gs. '+fmt(k.pagado)+' · Saldo Gs. '+fmt(k.saldo);
  const vg=document.querySelector('[data-vgs]');if(vg)vg.textContent='Gs. '+fmt(valorGs(b));
  const cr=document.querySelector('[data-conret]');if(cr)cr.textContent='Gs. '+fmt(k.totalConRet);
  const rtt=document.querySelector('[data-rettot]');if(rtt)rtt.textContent=k.ret?'Gs. '+fmt(k.ret):'No aplica';
  const sa=$('#s-amt');if(sa)sa.textContent='Gs. '+fmt(k.senaAmt);

  updateSideNumbers();
  if(now){drawDoc()}else{cancelAnimationFrame(rafDoc);rafDoc=requestAnimationFrame(drawDoc)}
}
function drawDoc(){
  const b=curB(),c=curC(),inner=$('#docinner');if(!b||!inner)return;
  inner.innerHTML=sheetsHTML(b,c,S.cfg);
  fitPreview();
}
function fitPreview(){
  const wrap=$('#docwrap'),inner=$('#docinner');if(!wrap||!inner)return;
  const w=wrap.clientWidth;if(!w)return;
  const s=Math.min(1,w/794);
  inner.style.transform=`scale(${s})`;
  wrap.style.height=Math.ceil(inner.offsetHeight*s)+'px';
}
window.addEventListener('resize',()=>requestAnimationFrame(fitPreview));
if(window.ResizeObserver){new ResizeObserver(()=>requestAnimationFrame(fitPreview)).observe(document.body)}

function sheet2(b,c,cfg,k,cls){
  const j=jornalOf(b,cfg),v=valorGs(b);
  const baseTxt=l=>{
    if(l.mode==='esc'){const ei=cfg.esc.find(x=>x.id===l.esc);return ei?(ei.fijo>0?'Monto fijo (IVA incluido)':`${fmtPct(escJ(ei,b))} jornales (Gs. ${fmt(j)}) + IVA`):'Costo de escribanía'}
    if(l.mode==='arancel'){
      const pctA=Number(l.val)===100?'':` × ${fmtPct(l.val)}%`;
      if(v<=0)return 'Sin valor del acto cargado';
      if(v<=1000000)return `5 jornales (Gs. ${fmt(j)} c/u)${pctA}`;
      const t=arancelTier(v,cfg);return `${fmtPct(t.pct)}% sobre Gs. ${fmt(v)} (escala art. 4)${pctA}`;
    }
    if(l.mode==='pct')return `${fmtPct(l.val)}% sobre Gs. ${fmt(v)}`;
    if(l.mode==='jornales')return `${fmtPct(l.val)} jornal${Number(l.val)===1?'':'es'} × Gs. ${fmt(j)}`;
    return 'Monto convenido';
  };
  let h=k.hon.map(r=>`<tr><td>${esc(lineLabel(r.l).replace(/ \(\d[\d,]*% del arancel\)$/,''))}</td><td class="mu">${esc(baseTxt(r.l))}</td><td class="n">${fmt(r.amt)}</td></tr>`).join('');
  if(!h)h=`<tr><td colspan="3" class="mu">Sin honorarios cargados.</td></tr>`;

  h+=`<tr class="sub"><td colspan="2">Total honorarios (I.V.A. 10% incluido)</td><td class="n">${fmt(k.tHon-k.desc)}</td></tr>
      <tr><td colspan="2" class="mu">Del cual I.V.A. 10%</td><td class="n mu">${fmt(Math.round((k.tHon-k.desc)/11))}</td></tr>`;
  let esc2='';
  if(b.tipo!=='juicio'){
    const t=arancelTier(v,cfg);
    esc2=`<div class="sh-box"><h4>Escala arancelaria · Ley N° 1.307/87, art. 4</h4><table class="sh-tbl sh-esc"><tbody>
      <tr class="${v>0&&v<=1000000?'hit':''}"><td>Hasta Gs. 1.000.000</td><td class="n">5 jornales</td></tr>
      ${cfg.escala.map(e=>`<tr class="${t===e&&v>0?'hit':''}"><td>Más de Gs. ${fmt(e.desde)}</td><td class="n">${fmtPct(e.pct)}%</td></tr>`).join('')}
      </tbody></table><div class="sh-note">Jornal mínimo de referencia: Gs. ${fmt(j)}.</div></div>`;
  }
  const costos=[...b.reembolso,...b.gastos].filter(l=>l.on&&(l.mode==='csj'||l.mode==='jornales'||l.mode==='esc'));
  let cs='';
  if(costos.length){
    cs=`<div class="sh-box"><h4>Costos de servicios y tasas · jornal mínimo Gs. ${fmt(j)}</h4><table class="sh-tbl"><tbody>${costos.map(l=>{
      const it=l.mode==='csj'?cfg.csj.find(x=>x.id===l.csj):null,ei=l.mode==='esc'?cfg.esc.find(x=>x.id===l.esc):null;
      const dsc=it?it.d:ei?(ei.fijo>0?'Monto fijo (IVA incl.)':`${fmtPct(escJ(ei,b))} jornales + IVA`):fmtPct(l.val)+' × jornal';
      return `<tr><td>${esc(l.label)}</td><td class="mu">${esc(dsc)}</td><td class="n">${fmt(lineAmount(l,b,cfg))}</td></tr>`}).join('')}</tbody></table>
      <div class="sh-note">Salario mínimo Gs. ${fmt(cfg.salario)} · ${esc(cfg.csjVigencia)}${costos.some(l=>l.mode==='esc')?' · '+esc(cfg.escVigencia):''}</div></div>`;
  }
  return `<div class="${cls}">${headHTML(b,cfg,'HOJA 2 · HONORARIOS')}
    <div class="sh-info"><div><label>Cliente</label><span>${esc(c&&c.nombre||'')||'&nbsp;'}</span></div><div><label>Presupuesto</label><span>N° ${pad(b.nro)}</span></div>
    <div class="w"><label>Concepto</label><span>${esc(b.concepto)||'&nbsp;'}</span></div>${v?`<div class="w"><label>Valor base</label><span class="num">${esc(valTxt(b))}</span></div>`:''}</div>

    ${esc2}${cs}<div class="sp1"></div>${footHTML(cfg,2,2)}</div>`;
}

function safeName(){const c=curC(),b=curB();return `Presupuesto_${pad(b.nro)}_${(c&&c.nombre||'cliente').replace(/[^\p{L}\p{N}]+/gu,'_').replace(/^_|_$/g,'')}`}
async function exportPDF(){
  const b=curB(),c=curC();if(!b||!S.dl)return;
  const btn=$('#btnPdf');if(btn){btn.disabled=true;btn.textContent='Generando PDF…'}
  let host;
  try{
    if(!window.jspdf||!window.html2canvas)throw new Error('lib');
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    host=document.createElement('div');host.className='offscreen';host.innerHTML=sheetsHTML(b,c,S.cfg);document.body.appendChild(host);
    await new Promise(r=>setTimeout(r,60));
    const pdf=new window.jspdf.jsPDF({unit:'pt',format:'a4',compress:true});
    const W=595.28;let first=true;
    for(const sh of host.querySelectorAll('.sheet')){
      const cv=await html2canvas(sh,{scale:2,backgroundColor:'#ffffff',logging:false,useCORS:true,windowWidth:794});
      const pageH=Math.round(cv.width*297/210),pages=Math.max(1,Math.ceil((cv.height-6)/pageH));
      for(let p=0;p<pages;p++){
        const h=Math.min(pageH,cv.height-p*pageH),sl=document.createElement('canvas');sl.width=cv.width;sl.height=h;
        const x=sl.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,sl.width,h);x.drawImage(cv,0,p*pageH,cv.width,h,0,0,cv.width,h);
        if(!first)pdf.addPage();first=false;
        pdf.addImage(sl.toDataURL('image/jpeg',0.93),'JPEG',0,0,W,h*W/cv.width);
      }
    }
    await S.dl.save({filename:safeName()+'.pdf',data:pdf.output('blob')});
    toast('PDF listo');
  }catch(e){
    if(e&&e.code==='declined'){}else if(e&&e.message==='lib')toast('No se pudo cargar el generador de PDF. Revisá la conexión.');else{console.error(e);toast('No se pudo generar el PDF')}
  }finally{if(host)host.remove();if(btn){btn.disabled=false;btn.textContent='Descargar PDF'}}
}

      <input class="in r num" inputmode="decimal" data-cfg="juicios.${i}.pct" data-t="dec" value="${String(j.pct||0).replace('.',',')}" aria-label="Porcentaje">
      <button class="btn sm ghost" type="button" data-act="rmjuicio" data-i="${i}" aria-label="Quitar">×</button></div>`).join('')}
  </section>
  <section class="card"><div class="card-h"><h3>Costos de servicios CSJ</h3><button class="btn sm" type="button" data-act="addcsj">＋ Costo</button></div>
    <div class="hint" style="margin-bottom:8px">Cada costo es un múltiplo del jornal. “× ajuste” cubre los casos de “50% de 3 jornales”. Si cargás un monto fijo, ese reemplaza la fórmula.</div>
    <div class="scroll"><div style="min-width:760px">
    <div class="crow h"><span>Nombre</span><span>Descripción</span><span>Grupo</span><span>× jornal</span><span>× ajuste</span><span>Fijo</span><span>IVA</span><span></span></div>
    ${cfg.csj.map((it,i)=>`<div class="crow">
      <input class="in" data-cfg="csj.${i}.n" data-t="text" value="${esc(it.n)}" aria-label="Nombre">
      <input class="in" data-cfg="csj.${i}.d" data-t="text" value="${esc(it.d)}" aria-label="Descripción">
      <select class="in" data-cfg="csj.${i}.g" data-t="sel" aria-label="Grupo">${Object.entries(CSJ_GROUPS).map(([k,t])=>`<option value="${k}" ${it.g===k?'selected':''}>${t.split(' ')[0]}</option>`).join('')}</select>
      <input class="in r num" inputmode="decimal" data-cfg="csj.${i}.f" data-t="dec" value="${String(it.f).replace('.',',')}" aria-label="Veces el jornal">
      <input class="in r num" inputmode="decimal" data-cfg="csj.${i}.m" data-t="dec" value="${String(it.m).replace('.',',')}" aria-label="Ajuste">
      <input class="in r num" inputmode="numeric" data-cfg="csj.${i}.fijo" data-t="money" value="${it.fijo?fmt(it.fijo):''}" placeholder="—" aria-label="Monto fijo">
      <input type="checkbox" data-cfg="csj.${i}.iva" data-t="bool" ${it.iva?'checked':''} aria-label="Con IVA">
      <button class="btn sm ghost" type="button" data-act="rmcsj" data-i="${i}" aria-label="Quitar">×</button></div>
      <div class="hint num" style="padding:0 0 2px" data-csjv="${i}"></div>`).join('')}
    </div></div>
  </section>
  <section class="card"><div class="card-h"><h3>Membrete y pie</h3></div>
    <div class="cfg-grid">
      ${cfgRow('Nombre de la escribanía (encabezado)','membrete.escribania','text',cfg.membrete.escribania)}
      ${cfgRow('Detalle bajo el nombre (escribano, registro)','membrete.escDetalle','text',cfg.membrete.escDetalle||'')}
      <label class="fld"><span>Membrete de escribanía</span><select class="in" data-cfg="membrete.escLogo" data-t="sel"><option value="sello" ${cfg.membrete.escLogo!=='logo'?'selected':''}>Sello del Colegio de Escribanos</option><option value="logo" ${cfg.membrete.escLogo==='logo'?'selected':''}>Logo Digital Law Office</option></select></label>
      ${cfgRow('Línea bajo el logo · Juicios','membrete.juicio','text',cfg.membrete.juicio)}
      ${cfgRow('Vigencia de la tabla de escribanía','escVigencia','text',cfg.escVigencia)}
      ${cfgRow('Ciudad (antes de la fecha)','membrete.ciudad','text',cfg.membrete.ciudad)}
      ${cfgRow('Contacto (dirección, teléfono, correo)','membrete.contacto','text',cfg.membrete.contacto)}
      ${cfgRow('Validez del presupuesto','membrete.validez','text',cfg.membrete.validez)}
      ${cfgRow('Texto de pie','membrete.pie','text',cfg.membrete.pie)}
    </div>
  </section>`;
  updateCsjPreview();
}
function updateCsjPreview(){
  const j=cfgJornal(S.cfg);
  document.querySelectorAll('[data-csjv]').forEach(el=>{const it=S.cfg.csj[+el.dataset.csjv];if(it)el.textContent=`→ Gs. ${fmt(csjBase(it,j))}${it.iva?` + IVA = Gs. ${fmt(csjAmount(it,j))}`:''}`});
  document.querySelectorAll('[data-escv]').forEach(el=>{const it=S.cfg.esc[+el.dataset.escv];if(it){const f=n=>{const b=Math.round(n*j);return b+Math.round(b/10)};el.textContent=it.fijo>0?fmt(it.fijo)+' (fijo)':`${fmt(f(it.j1))} · ${fmt(f(it.j2))}`}});
  const cj=$('#cfg-jornal');if(cj)cj.textContent='Gs. '+fmt(j);
}

/* ================= eventos ================= */
function setPath(obj,path,val){const p=path.split('.');let o=obj;for(let i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=val}
function readEl(el){
  const t=el.dataset.t;
  if(el.type==='checkbox')return el.checked;
  if(t==='money'){liveMoney(el);return parseMoney(el.value)}
  if(t==='dec')return parseDec(el.value);
  return el.value;
}
function saveBudget(b){queueSave('presupuestos',b)}
const main=$('#main');
main.addEventListener('input',e=>{
  const el=e.target,b=curB();
  if(el.dataset.cfg){
    setPath(S.cfg,el.dataset.cfg,readEl(el));queueSave('config',Object.assign({id:'tarifas'},S.cfg));
    if(/^(salario|jornalManual|csj|esc\.)/.test(el.dataset.cfg))updateCsjPreview();return;
  }
  if(el.dataset.c!==undefined){const c=curC();if(!c)return;c[el.dataset.c]=el.value;queueSave('clientes',c);updateSideNumbers();return}
  if(!b)return;
  if(el.tagName==='SELECT')return;
  if(el.type==='checkbox')return;
  if(el.dataset.g&&el.dataset.f){const l=b[el.dataset.g][+el.dataset.i];if(!l)return;l[el.dataset.f]=readEl(el)}
  else if(el.dataset.p!==undefined){const p=b.pagos[+el.dataset.p];if(!p)return;p[el.dataset.f]=el.dataset.t==='text'||el.type==='date'?el.value:readEl(el)}
  else if(el.dataset.r){b.ret=b.ret||{on:true,mode:'pct',val:0};b.ret[el.dataset.r]=readEl(el)}
  else if(el.dataset.d){b.descuento[el.dataset.d]=readEl(el)}
  else if(el.dataset.s){b.sena[el.dataset.s]=readEl(el)}
  else if(el.dataset.b){b[el.dataset.b]=el.dataset.t==='money'||el.dataset.t==='dec'?readEl(el):el.value}
  else return;
  saveBudget(b);refreshNumbers();
});
main.addEventListener('change',e=>{
  const el=e.target,b=curB();
  if(el.dataset.cfg){
    if(el.dataset.t==='bool'||el.dataset.t==='sel'){setPath(S.cfg,el.dataset.cfg,el.type==='checkbox'?el.checked:el.value);queueSave('config',Object.assign({id:'tarifas'},S.cfg));updateCsjPreview()}
    else if(el.dataset.t==='money'){el.value=el.value?fmt(parseMoney(el.value)):''}
    return;
  }
  if(el.dataset.actSel){
    if(el.value&&b){
      const g=el.dataset.g;
      if(el.dataset.actSel==='addcsj'){const it=S.cfg.csj.find(x=>x.id===el.value);b[g].push({id:uid(),k:'',label:it.n,on:true,mode:'csj',val:0,csj:it.id})}
      else{const it=S.cfg.esc.find(x=>x.id===el.value);b[g].push({id:uid(),k:'',label:it.n,on:true,mode:'esc',val:0,esc:it.id})}
      saveBudget(b);rerenderEditor();
    }return;
  }
  if(!b)return;
  if(el.dataset.flag){const f=el.dataset.flag;if(f==='desc'){b.descOn=el.checked}else if(f==='ret'){b.ret=b.ret||{on:false,mode:'pct',val:S.cfg.pcts.ret};b.ret.on=el.checked}else if(f==='plano'){const on=el.checked;const ensure=(g,k,label)=>{let l=b[g].find(x=>x.k===k);if(!l){l={id:uid(),k,label,on:false,mode:'monto',val:0};b[g].push(l)}l.on=on;if(on)S.showOff[g]=true};ensure('reembolso','plano','Aprobación de planos y otros');ensure('honorarios','h5','Aprobación de plano georreferenciado')}else{const m={insc:['gastos','insc'],tjh:['reembolso','tjh']}[f];const l=b[m[0]].find(x=>x.k===m[1]);if(l)l.on=el.checked}saveBudget(b);rerenderEditor();return}
  if(el.dataset.b==='juicioTipo'){const J=(S.cfg.juicios||[]).find(x=>x.id===el.value),old=(S.cfg.juicios||[]).find(x=>x.id===b.juicioTipo);b.juicioTipo=el.value;
    if(J){let l=b.reembolso.find(x=>x.k==='tj');if(!l){l={id:uid(),k:'tj',label:'',on:true,mode:'monto',val:0};b.reembolso.unshift(l)}
      l.on=true;l.label='Tasa judicial · '+J.n;const it=J.csj&&S.cfg.csj.find(x=>x.id===J.csj);if(it){l.mode='csj';l.csj=it.id;l.val=0}else{l.mode='pct';delete l.csj;l.val=J.pct||0}
      if(!b.concepto||b.concepto==='Juicio'||b.concepto==='Judicial en blanco'||(old&&b.concepto===old.n))b.concepto=J.n}
    saveBudget(b);rerenderEditor();return}
  if(el.dataset.b==='moneda'){const tc=Number(b.tc)||S.cfg.tc||6000;b.tc=tc;if(el.value==='USD'&&b.moneda!=='USD')b.valor=Math.round((b.valor||0)/tc);else if(el.value!=='USD'&&b.moneda==='USD')b.valor=Math.round((b.valor||0)*tc);b.moneda=el.value;saveBudget(b);rerenderEditor();return}
  if(el.dataset.b==='dist'){b.dist=el.value;saveBudget(b);rerenderEditor();return}
  if(el.dataset.g&&el.dataset.f==='on'){b[el.dataset.g][+el.dataset.i].on=el.checked;saveBudget(b);rerenderEditor();return}
  if(el.dataset.g&&el.dataset.f==='mode'){
    const l=b[el.dataset.g][+el.dataset.i],amt=lineAmount(l,b,S.cfg),nm=el.value,j=jornalOf(b,S.cfg);
    l.mode=nm;
    l.val=nm==='monto'?amt:nm==='arancel'?100:nm==='pct'?(valorGs(b)>0?Math.round(amt/valorGs(b)*1e6)/1e4:0):nm==='jornales'?Math.round(amt/j*1e3)/1e3:0;
    saveBudget(b);rerenderEditor();return;
  }
  if(el.dataset.r==='mode'){const am=calc(b,S.cfg).ret;b.ret.mode=el.value;b.ret.val=el.value==='monto'?am:(valorGs(b)>0?Math.round(am/valorGs(b)*1e4)/100:0);saveBudget(b);rerenderEditor();return}
  if(el.dataset.d==='mode'){const amt=calc(b,S.cfg).desc;b.descuento.mode=el.value;const tH=calc(b,S.cfg).tHon;b.descuento.val=el.value==='monto'?amt:(tH>0?Math.round(amt/tH*1e4)/100:0);saveBudget(b);rerenderEditor();return}
  if(el.dataset.s==='mode'){const am=calc(b,S.cfg).senaAmt,tot=calc(b,S.cfg).total;b.sena.mode=el.value;b.sena.val=el.value==='monto'?am:(tot>0?Math.round(am/tot*1e4)/100:0);saveBudget(b);rerenderEditor();return}
  if(el.dataset.b==='tipo'){b.tipo=el.value;saveBudget(b);renderAll();return}
  if(el.dataset.b==='hoja2'||el.dataset.b==='mostrarPagos'){b[el.dataset.b]=el.checked;saveBudget(b);refreshNumbers(true);return}
  if(el.dataset.p!==undefined&&el.tagName==='SELECT'){b.pagos[+el.dataset.p][el.dataset.f]=el.value;saveBudget(b);refreshNumbers();return}
  if(el.dataset.b==='fecha'){b.fecha=el.value;saveBudget(b);refreshNumbers();return}
  if(el.dataset.t==='money')el.value=el.value?fmt(parseMoney(el.value)):'';
});
function rerenderEditor(){
  const b=curB(),ed=$('#editor');if(!b||!ed)return;
  const y=window.scrollY;ed.innerHTML=editorHTML(b);refreshNumbers(true);window.scrollTo(0,y);
}
function addClient(){
  const c={id:uid(),nombre:'',doc:'',tel:'',nota:'',creado:Date.now()};
  S.clientes.push(c);S.selC=c.id;S.selB=null;S.view='main';S.picking=true;queueSave('clientes',c);renderAll();
  const i=$('#c-nombre');if(i)i.focus();
}
function newBudget(tplId){
  const c=curC();if(!c)return;
  const b=makeBudget(tplId,S.cfg,{clienteId:c.id,nro:nextNro(),fecha:today(),creado:Date.now()});
  S.budgets.push(b);S.selB=b.id;S.picking=false;S.tab='edit';saveBudget(b);renderAll();
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,b=curB(),c=curC();
  if(a!=='delc'&&a!=='delb')S.arm='';
  switch(a){
    case'area':{S.area=el.dataset.a;S.view='main';S.picking=false;const cs=sortedClients();const withB=cs.find(c=>budgetsOf(c.id).length);S.selC=(withB||cs[0]||{}).id||null;{const bs=S.selC?budgetsOf(S.selC):[];S.selB=bs.length?bs[bs.length-1].id:null}renderAll();window.scrollTo(0,0);break}
    case'selc':S.selC=el.dataset.id;S.view='main';S.picking=false;{const bs=budgetsOf(S.selC);S.selB=bs.length?bs[bs.length-1].id:null}renderAll();break;
    case'newc':addClient();break;
    case'pick':S.picking=!S.picking;renderMain();break;
    case'newb':newBudget(el.dataset.id);break;
    case'selb':S.selB=el.dataset.id;S.picking=false;renderAll();break;
    case'tab':S.tab=el.dataset.t;$('#work').dataset.tab=S.tab;document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.t===S.tab)));requestAnimationFrame(fitPreview);break;
    case'delc':
      if(S.arm!=='delc'){S.arm='delc';renderMain();setTimeout(()=>{if(S.arm==='delc'){S.arm='';if(S.view==='main')renderMain()}},4500);break}
      S.arm='';S.budgets.filter(x=>x.clienteId===c.id).forEach(x=>{removeDoc('presupuestos',x.id)});S.budgets=S.budgets.filter(x=>x.clienteId!==c.id);
      removeDoc('clientes',c.id);S.clientes=S.clientes.filter(x=>x.id!==c.id);
      S.selC=S.clientes.length?sortedClients()[0].id:null;{const bs=S.selC?budgetsOf(S.selC):[];S.selB=bs.length?bs[bs.length-1].id:null}renderAll();break;
    case'delb':
      if(S.arm!=='delb'){S.arm='delb';renderMain();setTimeout(()=>{if(S.arm==='delb'){S.arm='';if(S.view==='main')renderMain()}},4500);break}
      S.arm='';removeDoc('presupuestos',b.id);S.budgets=S.budgets.filter(x=>x.id!==b.id);{const bs=budgetsOf(c.id);S.selB=bs.length?bs[bs.length-1].id:null}renderAll();break;
    case'dup':{
      const n=JSON.parse(JSON.stringify(b));n.id=uid();n.nro=nextNro();n.pagos=[];n.fecha=today();n.creado=Date.now();
      ['reembolso','gastos','honorarios'].forEach(g=>n[g].forEach(l=>l.id=uid()));
      S.budgets.push(n);S.selB=n.id;saveBudget(n);renderAll();toast('Presupuesto duplicado (sin pagos)');break}
    case'showoff':S.showOff[el.dataset.g]=!S.showOff[el.dataset.g];rerenderEditor();break;
    case'addline':{const g=el.dataset.g;b[g].push({id:uid(),k:'',label:'Nueva línea',on:true,mode:g==='honorarios'?'monto':'monto',val:0});S.showOff[g]=S.showOff[g];saveBudget(b);rerenderEditor();
      const rows=document.querySelectorAll(`.ln[data-g="${g}"] .lbl`);const last=rows[rows.length-1];if(last){last.focus();last.select()}break}
    case'rmline':b[el.dataset.g].splice(+el.dataset.i,1);saveBudget(b);rerenderEditor();break;
    case'upjornal':b.jornal=cfgJornal(S.cfg);saveBudget(b);rerenderEditor();toast('Jornal actualizado');break;
    case'addpago':{
      const k=calc(b,S.cfg),kind=el.dataset.kind;
      const monto=kind==='sena'?k.senaAmt:kind==='saldo'?Math.max(0,k.saldo):0;
      b.pagos.push({id:uid(),fecha:today(),concepto:kind==='sena'?'Seña':kind==='saldo'?(b.pagos.length?'Cancelación de saldo':'Pago parcial'):(b.pagos.length?'Pago parcial':'Seña'),forma:'Efectivo',monto,nota:''});
      saveBudget(b);rerenderEditor();break}
    case'rmpago':b.pagos.splice(+el.dataset.i,1);saveBudget(b);rerenderEditor();break;
    case'pdf':exportPDF();break;
    case'xlsx':exportXLSX();break;
    case'back':S.view='main';renderAll();break;
    case'backup':exportBackup();break;
    case'addtier':{const l=S.cfg.escala[S.cfg.escala.length-1];S.cfg.escala.push({desde:(l?l.desde:0)*2||1000000,pct:0.5});queueSave('config',Object.assign({id:'tarifas'},S.cfg));renderConfig();break}
    case'rmtier':S.cfg.escala.splice(+el.dataset.i,1);queueSave('config',Object.assign({id:'tarifas'},S.cfg));renderConfig();break;
    case'addjuicio':(S.cfg.juicios=S.cfg.juicios||[]).push({id:'x'+uid(),n:'Nuevo tipo de juicio',csj:'',pct:0});queueSave('config',Object.assign({id:'tarifas'},S.cfg));renderConfig();break;
    case'rmjuicio':S.cfg.juicios.splice(+el.dataset.i,1);queueSave('config',Object.assign({id:'tarifas'},S.cfg));renderConfig();break;
    case'addcsj':S.cfg.csj.push({id:'x'+uid(),n:'Nuevo costo',d:'1 jornal mínimo',g:'tasa',f:1,m:1,fijo:0,iva:false});queueSave('config',Object.assign({id:'tarifas'},S.cfg));renderConfig();break;
    case'addesc':S.cfg.esc.push({id:'x'+uid(),n:'Nuevo costo',g:'cert',j1:1,j2:1});queueSave('config',Object.assign({id:'tarifas'},S.cfg));renderConfig();break;
    case'rmesc':S.cfg.esc.splice(+el.dataset.i,1);queueSave('config',Object.assign({id:'tarifas'},S.cfg));renderConfig();break;
    case'rmcsj':S.cfg.csj.splice(+el.dataset.i,1);queueSave('config',Object.assign({id:'tarifas'},S.cfg));renderConfig();break;
  }
});
$('#side').addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;S._qfocus=true;renderSide();S._qfocus=false}});
$('#btnHome').addEventListener('click',()=>{S.area=null;S.view='main';S.picking=false;S.arm='';renderAll();window.scrollTo(0,0)});
$('#btnCfg').addEventListener('click',()=>{S.view=S.view==='cfg'?'main':'cfg';renderAll();window.scrollTo(0,0)});
window.SB_BOOT(init);
</script>
